apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cerevix-ai-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 120
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/cerevix/cerevix-ai-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: FIREBASE_PROJECT_ID
              value: gen-lang-client-0458088105
            - name: FIREBASE_DATABASE_ID
              value: ai-studio-android-cerevixa-b25ada9e-127b-4d39-ab3b-e187571415b7
            - name: API_BASE_URL
              value: https://api.cerevix.ai/v1
            - name: APP_BASE_URL
              value: https://api.cerevix.ai
            - name: ADMIN_EMAILS
              value: prakashprusty334@gmail.com
            # Bind sensitive secrets via Google Cloud Secret Manager:
            # GEMINI_API_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET,
            # RAZORPAY_WEBHOOK_SECRET, CEREVIX_API_SECRET, FIREBASE_SERVICE_ACCOUNT
          startupProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
